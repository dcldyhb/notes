<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4eb">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f4eb;
      --ink: #254744;
      --muted: #6a7d71;
      --accent: #d65d44;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #d77d45;
      outline-offset: 5px;
    }
    .page { max-width: 1200px; margin: auto; padding: 35px 48px 28px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
    .brand-mark { width: 25px; height: 25px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: 2px; }
    .intro { text-align: center; padding: 43px 0 9px; }
    .eyebrow { margin: 0 0 13px; font-size: 10px; letter-spacing: 3px; color: var(--accent); font-weight: 600; }
    h1 { font-size: clamp(27px, 4.3vw, 47px); font-weight: 500; letter-spacing: 3px; margin: 0; }
    .intro p:last-child { margin: 15px 0 0; font-size: 13px; letter-spacing: 1px; color: var(--muted); }
    .illustration { margin: 0; position: relative; }
    .scene { display: block; width: 100%; height: auto; overflow: visible; }
    .controls {
      display: flex; align-items: center; justify-content: center; gap: 26px;
      margin: -4px auto 0; padding: 15px 0;
    }
    .play-button {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 11px 19px; border: 1px solid #254744; border-radius: 30px;
      background: var(--ink); color: var(--paper); min-width: 117px;
      font-size: 12px; transition: background .2s, transform .2s;
    }
    .play-button:hover { background: #36625c; transform: translateY(-1px); }
    .play-button svg { width: 13px; height: 13px; }
    .speed-control { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--muted); }
    .speed-control input { accent-color: var(--ink); width: 100px; cursor: pointer; }
    .speed-control output { min-width: 31px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .footer {
      margin-top: 30px; padding-top: 17px; border-top: 1px solid #d9ddd0;
      display: flex; justify-content: space-between; gap: 20px;
      font-size: 10px; color: var(--muted); letter-spacing: 1.5px;
    }
    .footer span:last-child { letter-spacing: 1px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 640px) {
      .page { padding: 24px 18px; }
      .edition { display: none; }
      .intro { padding-top: 38px; }
      h1 { letter-spacing: 1px; }
      .intro p:last-child { font-size: 12px; }
      .illustration { margin: 17px -10px 9px; }
      .controls { gap: 17px; flex-wrap: wrap; margin-top: 6px; }
      .speed-control { gap: 7px; }
      .speed-control input { width: 76px; }
      .footer { margin-top: 23px; font-size: 9px; letter-spacing: .5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .play-button { transition: none; }
    }
  </style>
</head>
<body>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'pelican', 'front-leg-path',
        'back-leg-path', 'front-knee', 'front-foot', 'back-foot', 'road',
        'clouds', 'waves', 'gulls', 'sailboat', 'wind-lines', 'scarf-tail',
        'scarf-seam', 'wing', 'ground-shadow'
      ].map(id => [id, byId(id)]));
      const toggle = byId('toggle');
      const speedInput = byId('speed');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = Number(speedInput.value);
      let time = 0;
      let lastTimestamp = null;
      let frameId = null;

      // Solve a two-segment leg so each foot stays on its moving pedal.
      function leg(hip, foot, upper, lower) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        return {
          x: hip.x + along * dx / distance + height * dy / distance,
          y: hip.y + along * dy / distance - height * dx / distance
        };
      }

      function draw() {
        const phase = time * Math.PI * 2 * 0.8;
        const travel = time * 170;
        const bob = Math.sin(phase * 2) * 2.1;
        const degrees = phase * 180 / Math.PI;
        const wheelDegrees = travel / 84 * 180 / Math.PI;
        parts['rear-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${wheelDegrees % 360})`);
        parts.crank.setAttribute('transform', `translate(475 460) rotate(${degrees % 360})`);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        for (const [side, offset, hipX] of [['front', 0, 450], ['back', Math.PI, 438]]) {
          const angle = phase + offset;
          const foot = { x: 475 + 32 * Math.cos(angle), y: 460 + 32 * Math.sin(angle) };
          const hip = { x: hipX, y: 317 + bob };
          const knee = leg(hip, foot, 100, 101);
          parts[`${side}-leg-path`].setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`);
          // The pedal axle is below the webbed foot, whose orientation stays level.
          parts[`${side}-foot`].setAttribute('transform', `translate(${foot.x} ${foot.y - 11})`);
          if (side === 'front') {
            parts['front-knee'].setAttribute('cx', knee.x);
            parts['front-knee'].setAttribute('cy', knee.y);
          }
        }
        parts.road.setAttribute('transform', `translate(${-travel % 340} 0)`);
        parts.clouds.setAttribute('transform', `translate(${-Math.sin(time * 0.08) * 22} 0)`);
        parts.waves.setAttribute('transform', `translate(${Math.sin(time * .35) * 9} 0)`);
        parts.gulls.setAttribute('transform', `translate(${Math.sin(time * .3) * 16} ${Math.sin(time * .8) * 4})`);
        parts.sailboat.setAttribute('transform', `translate(${791 - Math.sin(time * .12) * 17} ${309 + Math.sin(time * 1.2) * 1.5})`);
        parts['wind-lines'].setAttribute('transform', `translate(${-Math.sin(phase) * 5} 0)`);
        parts['wind-lines'].setAttribute('opacity', .45 + Math.sin(phase) * .12);
        parts['ground-shadow'].setAttribute('rx', 201 - bob * 1.5);
        const flutter = Math.sin(time * 8) * 5;
        parts['scarf-tail'].setAttribute('d', `M498 229Q465 ${215 + flutter} 431 ${224 + flutter}Q418 ${228 + flutter} 404 ${219 + flutter}L408 ${233 + flutter}Q435 ${244 + flutter} 468 235L494 243Z`);
        parts['scarf-seam'].setAttribute('d', `M491 235Q448 ${226 + flutter} 419 ${229 + flutter}`);
        // Compensate for the body bounce so the wing still holds the handlebar.
        parts.wing.setAttribute('d', `M418 240c27-13 58 4 86 24 30 23 48 30 72 31l59 ${-1 - bob}q13-2 21 7 5 7-5 10l-60 ${5 + bob}c-57 4-73-11-117-22-38-10-69-26-56-54Z`);
      }

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) return;
        if (lastTimestamp !== null) time += Math.min((timestamp - lastTimestamp) / 1000, .05) * speed;
        lastTimestamp = timestamp;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        toggle.setAttribute('aria-pressed', String(!playing));
        toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        byId('toggle-label').textContent = playing ? '歇一会儿' : '继续骑行';
        byId('pause-icon').style.display = playing ? '' : 'none';
        byId('play-icon').style.display = playing ? 'none' : '';
        lastTimestamp = null;
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = playing && !document.hidden ? requestAnimationFrame(tick) : null;
      }

      toggle.addEventListener('click', () => {
        playing = !playing;
        syncPlayback();
        byId('motion-status').textContent = playing ? '已继续骑行' : '动画已暂停';
      });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').value = `${speed}×`;
        speedInput.setAttribute('aria-valuetext', `${speed} 倍速`);
      });
      document.addEventListener('visibilitychange', syncPlayback);
      reducedMotion.addEventListener('change', event => {
        if (event.matches) {
          playing = false;
          syncPlayback();
          byId('motion-status').textContent = '已根据减少动态效果设置暂停动画';
        }
      });
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
